# Apache HTTPS hardening snippet (SWEET32 / weak TLS mitigation)
# Include inside the site's SSL VirtualHost, after generic SSL directives.
#
# Example (Windows XAMPP):
#   Include "D:/xampp/htdocs/kyas/deploy/apache/tls-hardening.conf"

<IfModule mod_ssl.c>
    SSLEngine on

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLProxyProtocol -all +TLSv1.2 +TLSv1.3

    # ECDHE-only + AEAD (TLS 1.2); explicit bans for 64-bit block suites (SWEET32) and legacy CBC/SHA.
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1:!DES-CBC3-SHA:!DES-CBC-SHA:!ECDHE-RSA-DES-CBC3-SHA:!ECDHE-ECDSA-DES-CBC3-SHA:!AES128-SHA:!AES256-SHA:!ECDHE-RSA-AES128-SHA:!ECDHE-RSA-AES256-SHA:!ECDHE-ECDSA-AES128-SHA:!ECDHE-ECDSA-AES256-SHA:!DH-RSA-DES-CBC3-SHA:!DH-DSS-DES-CBC3-SHA:!ECDH-RSA-DES-CBC3-SHA:!ECDH-ECDSA-DES-CBC3-SHA
    SSLProxyCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1:!DES-CBC3-SHA:!DES-CBC-SHA:!ECDHE-RSA-DES-CBC3-SHA:!ECDHE-ECDSA-DES-CBC3-SHA:!AES128-SHA:!AES256-SHA:!ECDHE-RSA-AES128-SHA:!ECDHE-RSA-AES256-SHA:!ECDHE-ECDSA-AES128-SHA:!ECDHE-ECDSA-AES256-SHA:!DH-RSA-DES-CBC3-SHA:!DH-DSS-DES-CBC3-SHA:!ECDH-RSA-DES-CBC3-SHA:!ECDH-ECDSA-DES-CBC3-SHA

    SSLHonorCipherOrder on
    SSLOpenSSLConfCmd MinProtocol TLSv1.2
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Curves X25519:secp384r1
    SSLOpenSSLConfCmd Options -SessionTicket,ServerPreference

    SSLCompression off
    SSLSessionTickets off
</IfModule>
