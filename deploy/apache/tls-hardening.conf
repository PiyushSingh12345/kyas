# Apache TLS hardening snippet for KYAS
# Include this in the HTTPS VirtualHost that serves this app.
#
# Example:
#   Include "D:/xampp/htdocs/kyas/deploy/apache/tls-hardening.conf"

# Minimize server fingerprinting in headers/error pages.
# Keep this outside SSL-only blocks so it applies consistently.
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    # Do not disclose PHP runtime details in responses.
    Header always unset X-Powered-By
</IfModule>

<IfModule mod_ssl.c>
    SSLEngine on

    # Disable deprecated protocols and only allow modern TLS.
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Restrict TLS 1.2 to forward-secret AEAD ciphers (no CBC/3DES/RC4/MD5/SHA1 suites).
    # Keep the explicit allow-list and also deny legacy classes as defense-in-depth.
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXP:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1
    SSLHonorCipherOrder on

    # Explicit TLS 1.3 suites for OpenSSL builds that support override.
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Curves X25519:secp384r1
    SSLOpenSSLConfCmd Options -SessionTicket,ServerPreference

    # Disable TLS compression and session tickets to reduce legacy attack surface.
    SSLCompression off
    SSLSessionTickets off
</IfModule>
