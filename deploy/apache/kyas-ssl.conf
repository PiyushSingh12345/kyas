# Apache 2.4 HTTPS vhost for KYAS (self-contained — no Include of other project files)
#
# Debian/Ubuntu typical layout:
#   sudo cp deploy/apache/kyas-ssl.conf /etc/apache2/sites-available/kyas-ssl.conf
#   sudo a2enmod ssl headers rewrite
#   sudo a2ensite kyas-ssl
#   # Edit ServerName, DocumentRoot, and certificate paths below, then:
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Ensure no other vhost or ssl.conf re-enables TLS 1.0/1.1 or weak ciphers for this server.

<IfModule mod_ssl.c>

<VirtualHost *:443>
    # --- site identity (edit for your host) ---
    ServerName kyas.example.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/kyas/public

    <Directory /var/www/kyas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- TLS: TLS 1.2+ only, AEAD ciphers (mitigates BEAST / legacy CBC / SWEET32 class issues) ---
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXP:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1
    SSLHonorCipherOrder on

    # TLS 1.3 (OpenSSL 1.1.1+)
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Curves X25519:secp384r1

    SSLCompression off
    SSLSessionTickets off

    # --- certificates (edit paths; Let’s Encrypt example) ---
    SSLCertificateFile /etc/letsencrypt/live/kyas.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kyas.example.com/privkey.pem
    # SSLCertificateChainFile is usually not needed when fullchain.pem includes the chain

    ErrorLog ${APACHE_LOG_DIR}/kyas-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/kyas-ssl-access.log combined
</VirtualHost>

</IfModule>
