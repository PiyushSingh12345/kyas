# Apache 2.4 HTTPS vhost for KYAS (production-ready for ky.amnex.co.in)
#
# Debian/Ubuntu typical layout:
#   sudo cp deploy/apache/kyas-ssl.conf /etc/apache2/sites-available/kyas-ssl.conf
#   sudo a2enmod ssl headers rewrite
#   sudo a2ensite kyas-ssl
#   # Verify values below if your paths differ, then:
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Ensure no other vhost or ssl.conf re-enables TLS 1.0/1.1 or weak ciphers for this server.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_ssl.c>

<VirtualHost *:443>
    # --- site identity ---
    ServerName ky.amnex.co.in
    ServerAlias 35.207.203.141 10.128.89.3
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/kyas/public

    <Directory /var/www/html/kyas/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- TLS: TLS 1.2+ only; ECDHE + AEAD only; explicit bans for SWEET32 (3DES) and legacy CBC-SHA ---
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLProxyProtocol -all +TLSv1.2 +TLSv1.3

    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1:!DES-CBC3-SHA:!DES-CBC-SHA:!ECDHE-RSA-DES-CBC3-SHA:!ECDHE-ECDSA-DES-CBC3-SHA:!AES128-SHA:!AES256-SHA:!ECDHE-RSA-AES128-SHA:!ECDHE-RSA-AES256-SHA:!ECDHE-ECDSA-AES128-SHA:!ECDHE-ECDSA-AES256-SHA:!DH-RSA-DES-CBC3-SHA:!DH-DSS-DES-CBC3-SHA:!ECDH-RSA-DES-CBC3-SHA:!ECDH-ECDSA-DES-CBC3-SHA
    SSLProxyCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1:!DES-CBC3-SHA:!DES-CBC-SHA:!ECDHE-RSA-DES-CBC3-SHA:!ECDHE-ECDSA-DES-CBC3-SHA:!AES128-SHA:!AES256-SHA:!ECDHE-RSA-AES128-SHA:!ECDHE-RSA-AES256-SHA:!ECDHE-ECDSA-AES128-SHA:!ECDHE-ECDSA-AES256-SHA:!DH-RSA-DES-CBC3-SHA:!DH-DSS-DES-CBC3-SHA:!ECDH-RSA-DES-CBC3-SHA:!ECDH-ECDSA-DES-CBC3-SHA
    SSLHonorCipherOrder on

    # OpenSSL minimum protocol (defense in depth if mod_ssl merge order differs).
    SSLOpenSSLConfCmd MinProtocol TLSv1.2
    # TLS 1.3 (OpenSSL 1.1.1+)
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Curves X25519:secp384r1
    SSLOpenSSLConfCmd Options -SessionTicket,ServerPreference

    SSLCompression off
    SSLSessionTickets off
    SSLInsecureRenegotiation off

    <IfModule mod_headers.c>
        Header always unset Server
        Header always unset X-Powered-By
    </IfModule>

    # --- certificates ---
    SSLCertificateFile /etc/ssl/certs/ky.amnex.co.in.pem
    SSLCertificateKeyFile /etc/ssl/private/ky.amnex.co.in.key
    # SSLCertificateChainFile /etc/ssl/certs/ky.amnex.co.in-chain.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/kyas-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/kyas-ssl-access.log combined
</VirtualHost>

</IfModule>
