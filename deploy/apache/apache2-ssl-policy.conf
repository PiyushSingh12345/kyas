# Apache2 global SSL/TLS policy for KYAS.
# Deploy as:
#   /etc/apache2/conf-available/kyas-ssl-policy.conf
# Then:
#   sudo a2enconf kyas-ssl-policy
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# This enforces modern TLS for all SSL-enabled vhosts so weak suites
# are not exposed by default or fallback vhosts.

<IfModule mod_ssl.c>
    # Disable TLS 1.0/1.1 and SSLv3 globally.
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLProxyProtocol -all +TLSv1.2 +TLSv1.3

    # Allow only forward-secret AEAD suites for TLS 1.2.
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXP:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1
    SSLProxyCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXP:!DES:!3DES:!RC4:!PSK:!kRSA:!SRP:!MD5:!SHA1
    SSLHonorCipherOrder on

    # TLS 1.3 suites (OpenSSL 1.1.1+).
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Curves X25519:secp384r1
    SSLOpenSSLConfCmd Options -SessionTicket,ServerPreference

    SSLCompression off
    SSLSessionTickets off
    SSLInsecureRenegotiation off
</IfModule>
