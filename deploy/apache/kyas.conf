# Apache 2.4 HTTP vhost for KYAS (port 80 -> 443 redirect)
#
# Debian/Ubuntu typical layout:
#   sudo cp deploy/apache/kyas.conf /etc/apache2/sites-available/kyas.conf
#   sudo a2enmod rewrite headers
#   sudo a2ensite kyas
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Notes:
# - We intentionally do NOT set HSTS here; it must only be sent over HTTPS.
# - We set the other security headers even on redirects to satisfy scanners
#   and to cover any non-PHP/static responses served over HTTP.

<VirtualHost *:80>
    ServerName ky.amnex.co.in
    ServerAlias www.ky.amnex.co.in

    <IfModule mod_headers.c>
        Header always unset Server
        Header always unset X-Powered-By

        Header always setifempty X-Content-Type-Options "nosniff"
        Header always setifempty X-Frame-Options "DENY"
        Header always setifempty Referrer-Policy "no-referrer"
        Header always setifempty Content-Security-Policy "default-src 'self'"

        # --- CORS hardening (override any global wildcard settings) ---
        Header always unset Access-Control-Allow-Origin
        Header always unset Access-Control-Allow-Credentials
        SetEnvIfNoCase Origin "^https?://(ky\\.amnex\\.co\\.in|www\\.ky\\.amnex\\.co\\.in)$" ACAO=$0
        Header always set Access-Control-Allow-Origin "%{ACAO}e" env=ACAO
        Header always set Access-Control-Allow-Credentials "true" env=ACAO
        Header merge Vary "Origin" env=ACAO
    </IfModule>

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/kyas-error.log
    CustomLog ${APACHE_LOG_DIR}/kyas-access.log combined
</VirtualHost>

