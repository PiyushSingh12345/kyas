# Optional non-SSL server hardening (server config / main httpd.conf only).
# Include once, e.g. near the end of httpd.conf:
#   Include "D:/xampp/htdocs/kyas/deploy/apache/tls-server-hardening.conf"

ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>
